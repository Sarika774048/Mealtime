<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <div class="login-container">
    <form class="login-form" action="callLoginServlet" method="post">
      <h1>Welcome Back</h1>
      <p>Login to your account</p>
      <p id="form-message" role="alert" aria-live="polite"></p>

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Login</button>

      <p class="register-link">
        Don't have an account? <a href="register.html">Register</a>
      </p>
    </form>
  </div>
  <script>
    const parameters = new URLSearchParams(window.location.search);
    const error = parameters.get("error");
    const success = parameters.get("success");
    const message = error || success;

    if (message) {
      const messageElement = document.getElementById("form-message");
      messageElement.textContent = message;
      messageElement.classList.add(error ? "error-message" : "success-message");
    }
  </script>
</body>
</html>
