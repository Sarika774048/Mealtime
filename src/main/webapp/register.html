<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="./css/register.css">
</head>
<body>
  <div class="register-container">
    <form class="register-form" action="callRegisterServlet" method="post">
      <h1>Create Account</h1>
      <p>Register to get started</p>
      <p id="form-message" role="alert" aria-live="polite"></p>

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" minlength="8" autocomplete="new-password" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

      <label for="address">Address</label>
      <textarea id="address" name="address" placeholder="Enter your address" required></textarea>

      <label for="role">Role</label>
      <select id="role" name="role" required>
        <option value="" disabled selected>Select your role</option>
        <option value="customer">Customer</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit">Register</button>

      <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </div>
  <script>
    const message = new URLSearchParams(window.location.search).get("error");
    if (message) {
      const messageElement = document.getElementById("form-message");
      messageElement.textContent = message;
      messageElement.classList.add("error-message");
    }
  </script>
</body>
</html>
